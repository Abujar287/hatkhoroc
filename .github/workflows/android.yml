name: Build Android APK

on:
  push:
    branches:
      - main  # আপনার মূল ব্রাঞ্চের নাম (main বা master)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies & Capacitor Core
        run: |
          npm install
          npm install @capacitor/core @capacitor/android @capacitor/cli @capacitor/assets @capacitor/app --save

      - name: Inject Commit SHA into Web App
        run: |
          COMMIT_SHA="${{ github.sha }}"
          sed -i "s/export const CURRENT_BUILD_SHA = .*/export const CURRENT_BUILD_SHA = '${COMMIT_SHA}';/g" src/utils/updateChecker.ts || true
          echo "Injected build SHA: $COMMIT_SHA"

      - name: Build Web App
        run: npm run build --if-present

      - name: Add & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Configure Android Permissions, FileProvider and Auto-Installer
        run: |
          # 1. Create file_paths.xml for FileProvider
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-files-path name="my_download" path="Download"/>
              <external-files-path name="external_files" path="."/>
              <external-cache-path name="external_cache" path="."/>
              <cache-path name="internal_cache" path="."/>
              <files-path name="internal_files" path="."/>
          </paths>
          EOF

          # 2. Update AndroidManifest.xml with required permissions and FileProvider
          python3 - << 'EOF'
          import os

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  content = f.read()

              permissions = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              """
              if "REQUEST_INSTALL_PACKAGES" not in content:
                  content = content.replace("<application", permissions + "\n    <application", 1)

              if "android:debuggable" not in content:
                  content = content.replace("<application", '<application android:debuggable="false"', 1)

              file_provider = """
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              """
              if "androidx.core.content.FileProvider" not in content:
                  content = content.replace("</application>", file_provider + "\n    </application>")

              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print("Successfully injected permissions and FileProvider into AndroidManifest.xml")
          else:
              print(f"Warning: {manifest_path} does not exist yet!")
          EOF

          # 3. Create MainActivity.java with BroadcastReceiver and FileProvider auto-installer
          mkdir -p android/app/src/main/java/com/abujar/hatkhoroc/
          cat << 'EOF' > android/app/src/main/java/com/abujar/hatkhoroc/MainActivity.java
          package com.abujar.hatkhoroc;

          import android.app.DownloadManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.Settings;
          import android.webkit.DownloadListener;
          import android.webkit.WebView;
          import android.widget.Toast;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              private long downloadId = -1;
              private BroadcastReceiver downloadReceiver;
              private boolean pendingInstall = false;

              public class WebAppInterface {
                  @android.webkit.JavascriptInterface
                  public void downloadAndInstallApk(final String apkUrl) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              startApkDownload(apkUrl, "HatKhorocApp");
                          }
                      });
                  }

                  @android.webkit.JavascriptInterface
                  public void openInstaller() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              triggerApkInstallation();
                          }
                      });
                  }

                  @android.webkit.JavascriptInterface
                  public void uninstallSelf() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_DELETE);
                                  intent.setData(Uri.parse("package:" + getPackageName()));
                                  startActivity(intent);
                              } catch (Exception e) {
                                  try {
                                      Intent intent = new Intent(Intent.ACTION_UNINSTALL_PACKAGE);
                                      intent.setData(Uri.parse("package:" + getPackageName()));
                                      startActivity(intent);
                                  } catch (Exception ignored) {}
                              }
                          }
                      });
                  }
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  setupDownloadReceiver();
                  setupDownloadListener();
              }

              private void setupDownloadListener() {
                  try {
                      WebView webView = this.bridge.getWebView();
                      if (webView != null) {
                          webView.addJavascriptInterface(new WebAppInterface(), "AndroidNativeUpdater");
                          webView.setDownloadListener(new DownloadListener() {
                              @Override
                              public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                                  startApkDownload(url, userAgent);
                              }
                          });
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private void startApkDownload(String url, String userAgent) {
                  try {
                      DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                      if (dm == null) return;

                      // Clean up previous update APK file to ensure forced update with clean package
                      File downloadsDir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                      if (downloadsDir != null) {
                          File oldApk = new File(downloadsDir, "hatkhoroc_update.apk");
                          if (oldApk.exists()) {
                              oldApk.delete();
                          }
                      }

                      DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                      request.setMimeType("application/vnd.android.package-archive");
                      request.addRequestHeader("User-Agent", userAgent);
                      request.setDescription("হাত খরচ অ্যাপের নতুন আপডেট ডাউনলোড হচ্ছে...");
                      request.setTitle("hatkhoroc.apk");
                      request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      request.setDestinationInExternalFilesDir(this, Environment.DIRECTORY_DOWNLOADS, "hatkhoroc_update.apk");

                      downloadId = dm.enqueue(request);
                      Toast.makeText(getApplicationContext(), "📥 নোটিফিকেশন বারে আপডেট ডাউনলোড শুরু হয়েছে...", Toast.LENGTH_LONG).show();
                  } catch (Exception e) {
                      e.printStackTrace();
                      Toast.makeText(getApplicationContext(), "ডাউনলোড শুরু করতে সমস্যা হয়েছে!", Toast.LENGTH_SHORT).show();
                  }
              }

              private void setupDownloadReceiver() {
                  downloadReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          long id = intent.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1);
                          if (id == downloadId && downloadId != -1) {
                              DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                              if (dm != null) {
                                  DownloadManager.Query query = new DownloadManager.Query();
                                  query.setFilterById(downloadId);
                                  Cursor cursor = dm.query(query);
                                  if (cursor != null) {
                                      if (cursor.moveToFirst()) {
                                          int columnIndex = cursor.getColumnIndex(DownloadManager.COLUMN_STATUS);
                                          if (columnIndex != -1 && cursor.getInt(columnIndex) == DownloadManager.STATUS_SUCCESSFUL) {
                                              Toast.makeText(context, "✅ ডাউনলোড সম্পন্ন! আপডেট ইনস্টল হচ্ছে...", Toast.LENGTH_SHORT).show();
                                              triggerApkInstallation();
                                          }
                                      }
                                      cursor.close();
                                  }
                              }
                          }
                      }
                  };

                  try {
                      if (Build.VERSION.SDK_INT >= 33) {
                          registerReceiver(downloadReceiver, new IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE), Context.RECEIVER_EXPORTED);
                      } else {
                          registerReceiver(downloadReceiver, new IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE));
                      }
                  } catch (Exception e) {
                      registerReceiver(downloadReceiver, new IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE));
                  }
              }

              private void triggerApkInstallation() {
                  try {
                      File downloadsDir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                      File apkFile = new File(downloadsDir, "hatkhoroc_update.apk");
                      if (!apkFile.exists() || apkFile.length() == 0) {
                          Toast.makeText(this, "ইনস্টল করার ফাইল পাওয়া যায়নি!", Toast.LENGTH_SHORT).show();
                          return;
                      }

                      // Check Unknown Sources Permission for Android 8.0+
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          if (!getPackageManager().canRequestPackageInstalls()) {
                              pendingInstall = true;
                              Toast.makeText(this, "হাত খরচ অ্যাপ আপডেট করতে পারমিশন অন করুন", Toast.LENGTH_LONG).show();
                              Intent permIntent = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES);
                              permIntent.setData(Uri.parse("package:" + getPackageName()));
                              startActivity(permIntent);
                              return;
                          }
                      }

                      Uri apkUri = FileProvider.getUriForFile(
                          this,
                          getPackageName() + ".fileprovider",
                          apkFile
                      );

                      Intent installIntent = new Intent(Intent.ACTION_VIEW);
                      installIntent.setDataAndType(apkUri, "application/vnd.android.package-archive");
                      installIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      installIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      installIntent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP);

                      List<ResolveInfo> resInfoList = getPackageManager().queryIntentActivities(installIntent, PackageManager.MATCH_DEFAULT_ONLY);
                      for (ResolveInfo resolveInfo : resInfoList) {
                          String pkg = resolveInfo.activityInfo.packageName;
                          grantUriPermission(pkg, apkUri, Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      }

                      startActivity(installIntent);
                  } catch (Exception e) {
                      e.printStackTrace();
                      Toast.makeText(this, "ইনস্টলার খুলতে সমস্যা হয়েছে: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

              @Override
              public void onResume() {
                  super.onResume();
                  if (pendingInstall) {
                      pendingInstall = false;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          if (getPackageManager().canRequestPackageInstalls()) {
                              triggerApkInstallation();
                          }
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  try {
                      if (downloadReceiver != null) {
                          unregisterReceiver(downloadReceiver);
                      }
                  } catch (Exception ignored) {}
              }
          }
          EOF
          echo "Native DownloadManager and Auto-Installer configured successfully!"

      - name: Generate Custom Android App Icons & Splash Screen
        run: |
          # 1. Ensure assets directory has the custom app logo
          mkdir -p assets
          cp public/logo.png assets/icon.png || true
          cp public/logo.png assets/splash.png || true
          cp public/logo.png assets/logo.png || true

          # 2. Try @capacitor/assets first
          npx @capacitor/assets generate --android || true

          # 3. Direct high-fidelity icon generator into Android res folders
          python3 -m pip install pillow --quiet || true
          python3 - << 'EOF'
          from PIL import Image
          import os

          logo_path = 'public/logo.png'
          if not os.path.exists(logo_path):
              logo_path = 'assets/icon.png'

          print(f"Applying custom app icon from: {logo_path}")
          img = Image.open(logo_path).convert("RGBA")

          res_dir = "android/app/src/main/res"
          densities = {
              "mipmap-mdpi": (48, 108),
              "mipmap-hdpi": (72, 162),
              "mipmap-xhdpi": (96, 216),
              "mipmap-xxhdpi": (144, 324),
              "mipmap-xxxhdpi": (192, 432)
          }

          for folder, (sz, fg_sz) in densities.items():
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              
              # Save standard and round launcher icons
              icon_img = img.resize((sz, sz), Image.Resampling.LANCZOS)
              icon_img.save(os.path.join(target_dir, "ic_launcher.png"), "PNG")
              icon_img.save(os.path.join(target_dir, "ic_launcher_round.png"), "PNG")
              
              # Save foreground icon for adaptive launchers
              fg_img = img.resize((fg_sz, fg_sz), Image.Resampling.LANCZOS)
              fg_img.save(os.path.join(target_dir, "ic_launcher_foreground.png"), "PNG")
              print(f"Updated icons in {folder} -> {sz}x{sz}")

          # Update splash images
          splash_folders = [
              "drawable", "drawable-port-mdpi", "drawable-port-hdpi",
              "drawable-port-xhdpi", "drawable-port-xxhdpi", "drawable-port-xxxhdpi",
              "drawable-land-mdpi", "drawable-land-hdpi", "drawable-land-xhdpi",
              "drawable-land-xxhdpi", "drawable-land-xxxhdpi"
          ]
          for sf in splash_folders:
              s_path = os.path.join(res_dir, sf)
              if os.path.exists(s_path):
                  img.save(os.path.join(s_path, "splash.png"), "PNG")
          print("All Android launcher icons and splash screens updated successfully!")
          EOF

      - name: Force Fix Kotlin Versions in Gradle
        run: |
          echo "
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }" >> android/build.gradle

      - name: Ensure Permanent Keystore and Configure Play Protect Safe Release Build
        run: |
          mkdir -p ~/.android
          mkdir -p android/app
          echo "" | base64 -d > ~/.android/debug.keystore
          cp ~/.android/debug.keystore android/app/debug.keystore || true
          cp ~/.android/debug.keystore android/app/release.keystore || true
          echo "Restored 100% permanent signature keystore!"

          python3 - << 'EOF'
          import os
          gradle_path = "android/app/build.gradle"
          if os.path.exists(gradle_path):
              with open(gradle_path, "r", encoding="utf-8") as f:
                  content = f.read()

              # Configure signing for release using permanent keystore
              release_signing = """
                  release {
                      storeFile file('release.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              """
              if "storeFile file('release.keystore')" not in content:
                  content = content.replace("signingConfigs {", "signingConfigs {" + release_signing)

              # Set release buildType to non-debuggable with release signature (Fixes Google Play Protect warning)
              if "signingConfig signingConfigs.release" not in content:
                  if "buildTypes {" in content and "release {" in content:
                      content = content.replace(
                          "release {",
                          "release {\n            signingConfig signingConfigs.release\n            debuggable false\n            minifyEnabled false"
                      )
                  elif "buildTypes {" in content:
                      content = content.replace(
                          "buildTypes {",
                          "buildTypes {\n        release {\n            signingConfig signingConfigs.release\n            debuggable false\n            minifyEnabled false\n        }"
                      )

              with open(gradle_path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Injected release signing and debuggable false into android/app/build.gradle")
          EOF

      - name: Auto Increment Android Version Code
        run: |
          BUILD_NUM=$((10000 + ${{ github.run_number }}))
          sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUM/g" android/app/build.gradle || true
          sed -i "s/versionName \".*\"/versionName \"1.$BUILD_NUM.0\"/g" android/app/build.gradle || true
          echo "Updated APK version code to $BUILD_NUM"

      - name: Clean and Build Android APK (Release & Non-Debuggable)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          # Build release APK (debuggable=false, signed with permanent keystore)
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Prepare and Rename APK Files
        run: |
          mkdir -p apk_output
          # Prefer release APK first (Play Protect safe)
          find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} "apk_output/hatkhoroc.apk" \; || true
          if [ ! -f "apk_output/hatkhoroc.apk" ]; then
            find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} "apk_output/hatkhoroc.apk" \;
          fi
          cp apk_output/hatkhoroc.apk "apk_output/হাত খরচ.apk"
          ls -la apk_output/


      - name: Upload APK File (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: hatkhoroc-APK
          path: "apk_output/*"

      - name: Delete Existing Latest Release if exists
        run: |
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Publish to GitHub Releases (Direct Download)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: latest
          name: "হাত খরচ - Latest Release"
          body: "স্বয়ংক্রিয়ভাবে জেনারেট হওয়া হাত খরচ অ্যান্ড্রয়েড অ্যাপ (hatkhoroc.apk)।"
          files: "apk_output/*"
          clobber: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
