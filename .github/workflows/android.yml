name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies & Capacitor Core
        run: |
          npm install
          npm install @capacitor/core @capacitor/android @capacitor/cli @capacitor/assets @capacitor/app --save

      - name: Inject Commit SHA into Web App
        run: |
          COMMIT_SHA="${{ github.sha }}"
          sed -i "s/export const CURRENT_BUILD_SHA = .*/export const CURRENT_BUILD_SHA = '${COMMIT_SHA}';/g" src/utils/updateChecker.ts || true
          echo "Injected build SHA: $COMMIT_SHA"

      - name: Build Web App
        run: npm run build --if-present

      - name: Add & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android
          rm -f android/app/src/main/assets/public/pwa-*.png android/app/src/main/assets/public/apple-touch-icon.png android/app/src/main/assets/public/workbox-*.js android/app/src/main/assets/public/sw.js android/app/src/main/assets/public/registerSW.js android/app/src/main/assets/public/manifest.webmanifest || true

      - name: Cache Android Debug Keystore for Seamless Updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hatkhoroc-debug-keystore-v1

      - name: Configure Android Permissions, FileProvider and Auto-Installer
        run: |
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="public_downloads" path="Download"/>
              <external-path name="external_storage_root" path="."/>
              <external-files-path name="my_download" path="Download"/>
              <external-files-path name="external_files" path="."/>
              <external-cache-path name="external_cache" path="."/>
              <cache-path name="internal_cache" path="."/>
              <files-path name="internal_files" path="."/>
          </paths>
          EOF

          python3 - << 'EOF'
          import os
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  content = f.read()

              permissions = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              """
              if "REQUEST_INSTALL_PACKAGES" not in content:
                  content = content.replace("<application", permissions + "\n    <application", 1)

              file_provider = """
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              """
              if "androidx.core.content.FileProvider" not in content:
                  content = content.replace("</application>", file_provider + "\n    </application>")

              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print("Successfully injected permissions and FileProvider into AndroidManifest.xml")
          EOF

          mkdir -p android/app/src/main/java/com/abujar/hatkhoroc/
          cat << 'EOF' > android/app/src/main/java/com/abujar/hatkhoroc/MainActivity.java
          package com.abujar.hatkhoroc;

          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.content.pm.Signature;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.Settings;
          import android.webkit.DownloadListener;
          import android.webkit.WebView;
          import android.widget.Toast;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.BridgeActivity;
          import org.json.JSONObject;
          import java.io.BufferedInputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.Arrays;
          import java.util.List;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipInputStream;

          public class MainActivity extends BridgeActivity {
              private static final int REQUEST_INSTALL_APK = 9001;
              private static final String OTA_PREFS = "hatkhoroc_ota";
              private static final String KEY_OTA_INSTALLED_AT = "ota_installed_at_ms";
              private static final String OTA_BUNDLE_URL = "https://github.com/Abujar287/hatkhoroc/releases/download/latest/web-bundle.zip";
              private boolean pendingInstall = false;
              private boolean pendingForceUninstall = false;
              private volatile String downloadState = "idle";
              private volatile int downloadProgress = 0;
              private volatile String downloadError = "";
              private File downloadedApkFile = null;
              private Thread downloadThread = null;

              public class WebAppInterface {
                  @android.webkit.JavascriptInterface
                  public void downloadAndInstallApk(final String apkUrl) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              startApkDownload(apkUrl, "HatKhorocApp");
                          }
                      });
                  }

                  @android.webkit.JavascriptInterface
                  public String getDownloadState() {
                      try {
                          JSONObject obj = new JSONObject();
                          obj.put("state", downloadState);
                          obj.put("progress", downloadProgress);
                          obj.put("error", downloadError);
                          return obj.toString();
                      } catch (Exception e) {
                          return "{\"state\":\"idle\",\"progress\":0,\"error\":\"\"}";
                      }
                  }

                  @android.webkit.JavascriptInterface
                  public void openInstaller() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              if (!"installing".equals(downloadState) && !"installed".equals(downloadState)) {
                                  installOrForceUpdateApk(false);
                              }
                          }
                      });
                  }

                  @android.webkit.JavascriptInterface
                  public void openUpdatedApp() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  File otaDir = new File(getFilesDir(), "ota_public");
                                  File otaIndex = new File(otaDir, "index.html");
                                  if (otaIndex.exists() && bridge != null) {
                                      downloadState = "idle";
                                      downloadProgress = 0;
                                      downloadError = "";
                                      bridge.setServerBasePath(otaDir.getAbsolutePath());
                                      return;
                                  }
                              } catch (Exception ignored) {}
                              try {
                                  Intent launchIntent = getPackageManager().getLaunchIntentForPackage(getPackageName());
                                  if (launchIntent != null) {
                                      launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TASK);
                                      startActivity(launchIntent);
                                      finish();
                                      return;
                                  }
                              } catch (Exception ignored) {}
                              try {
                                  if (bridge != null && bridge.getWebView() != null) {
                                      bridge.getWebView().reload();
                                  }
                              } catch (Exception ignored) {}
                          }
                      });
                  }

                  @android.webkit.JavascriptInterface
                  public void resetDownloadState() {
                      if (!"downloading".equals(downloadState) && !"installing".equals(downloadState)) {
                          downloadState = "idle";
                          downloadProgress = 0;
                          downloadError = "";
                      }
                  }

                  @android.webkit.JavascriptInterface
                  public void forceUninstallAndInstall() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              installOrForceUpdateApk(true);
                          }
                      });
                  }

                  @android.webkit.JavascriptInterface
                  public void uninstallSelf() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              launchUninstallOnly();
                          }
                      });
                  }

                  @android.webkit.JavascriptInterface
                  public void saveZipToDownloads(final String base64Data, final String fileName) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  byte[] decodedBytes = android.util.Base64.decode(base64Data.contains(",") ? base64Data.split(",")[1] : base64Data, android.util.Base64.DEFAULT);
                                  File downloadsDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                                  if (!downloadsDir.exists()) downloadsDir.mkdirs();
                                  File outputFile = new File(downloadsDir, fileName);
                                  java.io.FileOutputStream fos = new java.io.FileOutputStream(outputFile);
                                  fos.write(decodedBytes);
                                  fos.flush();
                                  fos.close();

                                  DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                                  if (dm != null) {
                                      dm.addCompletedDownload(
                                          fileName,
                                          "হাত খরচ রিপোর্ট প্যাকেজ",
                                          true,
                                          "application/zip",
                                          outputFile.getAbsolutePath(),
                                          outputFile.length(),
                                          true
                                      );
                                  }

                                  Toast.makeText(getApplicationContext(), "✅ ডাউনলোড ফোল্ডারে সেভ হয়েছে: " + fileName, Toast.LENGTH_LONG).show();
                              } catch (Exception e) {
                                  e.printStackTrace();
                                  Toast.makeText(getApplicationContext(), "সেভ করতে সমস্যা হয়েছে: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                              }
                          }
                      });
                  }
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  applySavedOtaBundleIfNewer();
                  setupDownloadListener();
              }

              private void applySavedOtaBundleIfNewer() {
                  try {
                      SharedPreferences prefs = getSharedPreferences(OTA_PREFS, Context.MODE_PRIVATE);
                      long otaInstalledAt = prefs.getLong(KEY_OTA_INSTALLED_AT, 0L);
                      File otaDir = new File(getFilesDir(), "ota_public");
                      File otaIndex = new File(otaDir, "index.html");
                      if (otaInstalledAt <= 0L || !otaIndex.exists()) return;

                      long apkUpdatedAt = 0L;
                      try {
                          PackageInfo pi = getPackageManager().getPackageInfo(getPackageName(), 0);
                          apkUpdatedAt = pi.lastUpdateTime;
                      } catch (Exception ignored) {}

                      if (otaInstalledAt >= apkUpdatedAt && bridge != null) {
                          bridge.setServerBasePath(otaDir.getAbsolutePath());
                      } else if (apkUpdatedAt > otaInstalledAt) {
                          deleteRecursive(otaDir);
                          prefs.edit().remove(KEY_OTA_INSTALLED_AT).apply();
                      }
                  } catch (Exception ignored) {}
              }

              private void setupDownloadListener() {
                  try {
                      WebView webView = this.bridge.getWebView();
                      if (webView != null) {
                          webView.addJavascriptInterface(new WebAppInterface(), "AndroidNativeUpdater");
                          webView.setDownloadListener(new DownloadListener() {
                              @Override
                              public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                                  startApkDownload(url, userAgent);
                              }
                          });
                      }
                  } catch (Exception e) {}
              }

              private void notifyWebDownloadState(final String state, final int progress, final String error) {
                  downloadState = state;
                  downloadProgress = progress;
                  downloadError = error != null ? error : "";
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if (bridge == null) return;
                              WebView webView = bridge.getWebView();
                              if (webView == null) return;
                              String safeErr = JSONObject.quote(downloadError);
                              String js = "if (window.__onNativeApkDownloadState) window.__onNativeApkDownloadState('"
                                  + state + "', " + progress + ", " + safeErr + ");";
                              webView.evaluateJavascript(js, null);
                          } catch (Exception ignored) {}
                      }
                  });
              }

              private HttpURLConnection openWithRedirects(String urlStr, String userAgent) throws Exception {
                  String currentUrl = urlStr;
                  int redirects = 0;
                  while (redirects < 8) {
                      URL parsed = new URL(currentUrl);
                      HttpURLConnection conn = (HttpURLConnection) parsed.openConnection();
                      conn.setInstanceFollowRedirects(false);
                      conn.setConnectTimeout(20000);
                      conn.setReadTimeout(30000);
                      conn.setRequestProperty("User-Agent", (userAgent != null && !userAgent.trim().isEmpty()) ? userAgent : "HatKhorocUpdater/1.0");
                      conn.setRequestProperty("Accept", "*/*");
                      int code = conn.getResponseCode();
                      if (code == HttpURLConnection.HTTP_MOVED_PERM
                          || code == HttpURLConnection.HTTP_MOVED_TEMP
                          || code == HttpURLConnection.HTTP_SEE_OTHER
                          || code == 307
                          || code == 308) {
                          String loc = conn.getHeaderField("Location");
                          conn.disconnect();
                          if (loc == null || loc.trim().isEmpty()) {
                              throw new Exception("Redirect location missing");
                          }
                          currentUrl = new URL(parsed, loc).toString();
                          redirects++;
                      } else {
                          return conn;
                      }
                  }
                  throw new Exception("Too many redirects");
              }

              private boolean downloadFileWithProgress(String urlStr, String userAgent, File outFile) throws Exception {
                  HttpURLConnection conn = null;
                  InputStream input = null;
                  FileOutputStream output = null;
                  try {
                      conn = openWithRedirects(urlStr, userAgent);
                      int responseCode = conn.getResponseCode();
                      if (responseCode == HttpURLConnection.HTTP_NOT_FOUND) {
                          return false;
                      }
                      if (responseCode < 200 || responseCode >= 300) {
                          throw new Exception("Server returned HTTP " + responseCode);
                      }

                      long totalBytes = -1;
                      String clHeader = conn.getHeaderField("Content-Length");
                      if (clHeader != null) {
                          try {
                              totalBytes = Long.parseLong(clHeader.trim());
                          } catch (Exception ignored) {}
                      }
                      if (totalBytes <= 0) {
                          totalBytes = conn.getContentLength();
                      }

                      File tempFile = new File(outFile.getParentFile(), outFile.getName() + ".tmp");
                      if (outFile.exists()) outFile.delete();
                      if (tempFile.exists()) tempFile.delete();

                      input = new BufferedInputStream(conn.getInputStream(), 16384);
                      output = new FileOutputStream(tempFile);

                      byte[] buffer = new byte[16384];
                      long downloaded = 0;
                      int count;
                      int lastPct = 2;
                      long lastNotifyMs = 0;

                      while ((count = input.read(buffer)) != -1) {
                          output.write(buffer, 0, count);
                          downloaded += count;
                          int pct;
                          if (totalBytes > 0) {
                              pct = (int) Math.min(99, Math.max(3, (downloaded * 100L) / totalBytes));
                          } else {
                              pct = Math.min(92, lastPct + 1);
                          }
                          long now = System.currentTimeMillis();
                          if (pct != lastPct && (now - lastNotifyMs >= 160 || pct >= 99)) {
                              lastPct = pct;
                              lastNotifyMs = now;
                              notifyWebDownloadState("downloading", pct, "");
                          }
                      }

                      output.flush();
                      output.close();
                      output = null;
                      input.close();
                      input = null;

                      if (!tempFile.renameTo(outFile)) {
                          throw new Exception("Failed to prepare update file");
                      }
                      return true;
                  } finally {
                      try { if (output != null) output.close(); } catch (Exception ignored) {}
                      try { if (input != null) input.close(); } catch (Exception ignored) {}
                      try { if (conn != null) conn.disconnect(); } catch (Exception ignored) {}
                  }
              }

              private void deleteRecursive(File fileOrDir) {
                  if (fileOrDir == null || !fileOrDir.exists()) return;
                  if (fileOrDir.isDirectory()) {
                      File[] children = fileOrDir.listFiles();
                      if (children != null) {
                          for (File child : children) {
                              deleteRecursive(child);
                          }
                      }
                  }
                  fileOrDir.delete();
              }

              private void unzipBundle(File zipFile, File targetDir) throws Exception {
                  if (targetDir.exists()) {
                      deleteRecursive(targetDir);
                  }
                  if (!targetDir.mkdirs()) {
                      throw new Exception("Could not create update directory");
                  }
                  String canonicalTarget = targetDir.getCanonicalPath();
                  ZipInputStream zis = null;
                  try {
                      zis = new ZipInputStream(new BufferedInputStream(new FileInputStream(zipFile)));
                      ZipEntry entry;
                      byte[] buffer = new byte[16384];
                      while ((entry = zis.getNextEntry()) != null) {
                          String name = entry.getName();
                          if (name == null || name.trim().isEmpty()) {
                              zis.closeEntry();
                              continue;
                          }
                          File outFile = new File(targetDir, name);
                          String canonicalOut = outFile.getCanonicalPath();
                          if (!canonicalOut.equals(canonicalTarget) && !canonicalOut.startsWith(canonicalTarget + File.separator)) {
                              throw new Exception("Invalid zip entry path");
                          }
                          if (entry.isDirectory()) {
                              outFile.mkdirs();
                          } else {
                              File parent = outFile.getParentFile();
                              if (parent != null && !parent.exists()) parent.mkdirs();
                              FileOutputStream fos = new FileOutputStream(outFile);
                              try {
                                  int len;
                                  while ((len = zis.read(buffer)) != -1) {
                                      fos.write(buffer, 0, len);
                                  }
                                  fos.flush();
                              } finally {
                                  fos.close();
                              }
                          }
                          zis.closeEntry();
                      }
                  } finally {
                      if (zis != null) {
                          try { zis.close(); } catch (Exception ignored) {}
                      }
                  }
              }

              private void startApkDownload(final String urlStr, final String userAgent) {
                  if ("downloading".equals(downloadState) || "installing".equals(downloadState)) {
                      notifyWebDownloadState(downloadState, downloadProgress, "");
                      return;
                  }

                  notifyWebDownloadState("downloading", 2, "");

                  downloadThread = new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              // 1. Try 100% in-app OTA web-bundle.zip first (no external page or leaving app)
                              File zipFile = new File(getCacheDir(), "web-bundle.zip");
                              boolean gotOtaZip = false;
                              try {
                                  gotOtaZip = downloadFileWithProgress(OTA_BUNDLE_URL, userAgent, zipFile);
                              } catch (Exception zipErr) {
                                  gotOtaZip = false;
                              }

                              if (gotOtaZip && zipFile.exists() && zipFile.length() > 1024) {
                                  notifyWebDownloadState("installing", 100, "");
                                  File stagingDir = new File(getFilesDir(), "ota_public_staging");
                                  File otaDir = new File(getFilesDir(), "ota_public");
                                  unzipBundle(zipFile, stagingDir);
                                  zipFile.delete();

                                  File stagingIndex = new File(stagingDir, "index.html");
                                  if (!stagingIndex.exists()) {
                                      deleteRecursive(stagingDir);
                                      throw new Exception("Invalid update bundle");
                                  }

                                  deleteRecursive(otaDir);
                                  if (!stagingDir.renameTo(otaDir)) {
                                      throw new Exception("Failed to activate update bundle");
                                  }

                                  getSharedPreferences(OTA_PREFS, Context.MODE_PRIVATE)
                                      .edit()
                                      .putLong(KEY_OTA_INSTALLED_AT, System.currentTimeMillis())
                                      .apply();

                                  notifyWebDownloadState("installed", 100, "");
                                  return;
                              }

                              // 2. Fallback: download APK cleanly in-app
                              File targetDir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                              if (targetDir == null) targetDir = getCacheDir();
                              if (!targetDir.exists()) targetDir.mkdirs();

                              File finalFile = new File(targetDir, "hatkhoroc_update.apk");
                              boolean gotApk = downloadFileWithProgress(urlStr, userAgent, finalFile);
                              if (!gotApk) {
                                  throw new Exception("Update file not found on server");
                              }
                              downloadedApkFile = finalFile;

                              notifyWebDownloadState("installing", 100, "");
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      installOrForceUpdateApk(false);
                                  }
                              });
                          } catch (Exception e) {
                              notifyWebDownloadState("failed", 0, e.getMessage() != null ? e.getMessage() : "Download failed");
                          }
                      }
                  });
                  downloadThread.start();
              }

              private boolean isApkSignatureCompatible(File apkFile) {
                  try {
                      if (apkFile == null || !apkFile.exists()) return true;
                      PackageManager pm = getPackageManager();
                      int flags = Build.VERSION.SDK_INT >= Build.VERSION_CODES.P
                          ? PackageManager.GET_SIGNING_CERTIFICATES
                          : PackageManager.GET_SIGNATURES;

                      PackageInfo installedInfo = pm.getPackageInfo(getPackageName(), flags);
                      PackageInfo archiveInfo = pm.getPackageArchiveInfo(apkFile.getAbsolutePath(), flags);
                      if (archiveInfo == null) return true;

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          if (installedInfo.signingInfo == null || archiveInfo.signingInfo == null) return true;
                          Signature[] s1 = installedInfo.signingInfo.getApkContentsSigners();
                          Signature[] s2 = archiveInfo.signingInfo.getApkContentsSigners();
                          if (s1 == null || s2 == null || s1.length == 0 || s2.length == 0) return true;
                          return Arrays.equals(s1[0].toByteArray(), s2[0].toByteArray());
                      } else {
                          Signature[] s1 = installedInfo.signatures;
                          Signature[] s2 = archiveInfo.signatures;
                          if (s1 == null || s2 == null || s1.length == 0 || s2.length == 0) return true;
                          return Arrays.equals(s1[0].toByteArray(), s2[0].toByteArray());
                      }
                  } catch (Exception e) {
                      return true;
                  }
              }

              private void launchUninstallOnly() {
                  try {
                      Toast.makeText(getApplicationContext(), "🗑️ পুরনো ভার্সন আনইনস্টল করুন", Toast.LENGTH_LONG).show();
                      Intent uninstallIntent = new Intent(Intent.ACTION_DELETE);
                      uninstallIntent.setData(Uri.parse("package:" + getPackageName()));
                      uninstallIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(uninstallIntent);
                  } catch (Exception e) {}
              }

              private void installOrForceUpdateApk(boolean forceUninstall) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          if (!getPackageManager().canRequestPackageInstalls()) {
                              pendingInstall = true;
                              pendingForceUninstall = forceUninstall;
                              notifyWebDownloadState("installing", 100, "");
                              Toast.makeText(this, "হাত খরচ অ্যাপ আপডেট করতে পারমিশন অন করুন", Toast.LENGTH_LONG).show();
                              Intent permIntent = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES);
                              permIntent.setData(Uri.parse("package:" + getPackageName()));
                              startActivity(permIntent);
                              return;
                          }
                      }

                      if (forceUninstall || !isApkSignatureCompatible(downloadedApkFile)) {
                          notifyWebDownloadState("failed", 0, "অ্যাপ সিগনেচার ভিন্ন। পুরনো অ্যাপ আনইনস্টল করে নতুন আপডেট ইনস্টল করুন।");
                          launchUninstallOnly();
                          return;
                      }

                      if (downloadedApkFile == null || !downloadedApkFile.exists()) {
                          notifyWebDownloadState("failed", 0, "ডাউনলোড করা APK ফাইল খুঁজে পাওয়া যায়নি");
                          return;
                      }

                      Uri apkUri = FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", downloadedApkFile);

                      notifyWebDownloadState("installing", 100, "");

                      Intent installIntent = new Intent(Intent.ACTION_VIEW);
                      installIntent.setDataAndType(apkUri, "application/vnd.android.package-archive");
                      installIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      installIntent.putExtra(Intent.EXTRA_RETURN_RESULT, true);

                      List<ResolveInfo> resInfoList = getPackageManager().queryIntentActivities(installIntent, PackageManager.MATCH_DEFAULT_ONLY);
                      for (ResolveInfo resolveInfo : resInfoList) {
                          grantUriPermission(resolveInfo.activityInfo.packageName, apkUri, Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      }
                      startActivityForResult(installIntent, REQUEST_INSTALL_APK);
                  } catch (Exception e) {
                      notifyWebDownloadState("failed", 0, e.getMessage() != null ? e.getMessage() : "ইনস্টল শুরু করা যায়নি");
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQUEST_INSTALL_APK) {
                      if (resultCode == android.app.Activity.RESULT_OK) {
                          notifyWebDownloadState("installed", 100, "");
                      } else {
                          notifyWebDownloadState("failed", 0, "ইনস্টলেশন বাতিল হয়েছে। আবার চেষ্টা করুন।");
                      }
                  }
              }

              @Override
              public void onResume() {
                  super.onResume();
                  if (pendingInstall) {
                      boolean force = pendingForceUninstall;
                      pendingInstall = false;
                      pendingForceUninstall = false;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          if (getPackageManager().canRequestPackageInstalls()) {
                              installOrForceUpdateApk(force);
                          } else {
                              notifyWebDownloadState("failed", 0, "ইনস্টল পারমিশন দেওয়া হয়নি।");
                          }
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
              }
          }
          EOF

      - name: Generate Custom Android App Icons
        run: |
          mkdir -p assets
          cp public/logo.png assets/icon.png || true
          cp public/logo.png assets/splash.png || true
          npx @capacitor/assets generate --android --iconBackgroundColor '#042F2E' --splashBackgroundColor '#042F2E' || true
          rm -rf android/app/src/main/res/drawable-land-* android/app/src/main/res/drawable-port-xxxhdpi android/app/src/main/res/drawable-port-xxhdpi || true

      - name: Auto Increment Android Version Code & Enable R8 Shrinking
        run: |
          BUILD_NUM=$((10000 + ${{ github.run_number }}))
          sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUM/g" android/app/build.gradle || true
          sed -i "s/versionName \".*\"/versionName \"1.$BUILD_NUM.0\"/g" android/app/build.gradle || true

          cat << 'EOF' >> android/app/proguard-rules.pro
          -keep class com.abujar.hatkhoroc.** { *; }
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          -keep class com.getcapacitor.** { *; }
          -dontwarn com.getcapacitor.**
          EOF

          python3 - << 'EOF'
          import re
          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r", encoding="utf-8") as f:
              content = f.read()

          if "resConfigs" not in content:
              content = content.replace("defaultConfig {", 'defaultConfig {\n        resConfigs "en", "bn"', 1)

          content = re.sub(r"minifyEnabled\s+false", "minifyEnabled true", content)
          if "shrinkResources" not in content:
              content = content.replace("minifyEnabled true", "minifyEnabled true\n            shrinkResources true")
          if "signingConfig signingConfigs.debug" not in content and "buildTypes {" in content:
              content = content.replace(
                  "release {",
                  "release {\n            signingConfig signingConfigs.debug",
                  1
              )
          content = content.replace("signingConfig signingConfigs.release", "signingConfig signingConfigs.debug")

          with open(gradle_path, "w", encoding="utf-8") as f:
              f.write(content)
          print("Configured R8 shrinking and debug keystore signing on release buildType")
          EOF

      - name: Build Shrunk Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease --stacktrace

      - name: Prepare and Rename APK Files
        run: |
          mkdir -p apk_output
          find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} "apk_output/hatkhoroc.apk" \; || true
          cp apk_output/hatkhoroc.apk "apk_output/হাত খরচ.apk"
          (cd android/app/src/main/assets/public && zip -rq "${GITHUB_WORKSPACE}/apk_output/web-bundle.zip" .) || true
          ls -lh apk_output/

      - name: Upload APK File (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: hatkhoroc-APK
          path: "apk_output/*"

      - name: Publish to GitHub Releases (Direct Download)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: latest
          name: "হাত খরচ - Latest Release"
          body: "স্বয়ংক্রিয়ভাবে জেনারেট হওয়া হাত খরচ অ্যান্ড্রয়েড অ্যাপ (hatkhoroc.apk)।"
          files: "apk_output/*"
          clobber: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
