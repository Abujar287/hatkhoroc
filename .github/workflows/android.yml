name: Build Android APK

on:
  push:
    branches:
      - main  # আপনার মূল ব্রাঞ্চের নাম (main বা master)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies & Capacitor Core
        run: |
          npm install
          npm install @capacitor/core @capacitor/android @capacitor/cli @capacitor/assets --save

      - name: Build Web App
        run: npm run build --if-present

      - name: Generate App Icons and Splash (Optional)
        run: |
          # যদি আপনার প্রজেক্টের assets/icon.png ফাইল থাকে তবে এটি অটোমেটিক লোগো সেট করে দেবে
          if [ -f "assets/icon.png" ]; then
            npx @capacitor/assets generate --iconAndSplashPath assets/icon.png
          fi

      - name: Add & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Force Fix Kotlin Versions in Gradle
        run: |
          echo "
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }" >> android/build.gradle

      - name: Clean and Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Hat-Khoroch-APK
          path: android/app/build/outputs/apk/debug/*.apk
