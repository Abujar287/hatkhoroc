name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies & Capacitor Core
        run: |
          npm install
          npm install @capacitor/core @capacitor/android @capacitor/cli @capacitor/assets @capacitor/app --save

      - name: Inject Commit SHA into Web App
        run: |
          COMMIT_SHA="${{ github.sha }}"
          sed -i "s/export const CURRENT_BUILD_SHA = .*/export const CURRENT_BUILD_SHA = '${COMMIT_SHA}';/g" src/utils/updateChecker.ts || true
          echo "Injected build SHA: $COMMIT_SHA"

      - name: Build Web App
        run: npm run build --if-present

      - name: Add & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Cache Android Debug Keystore for Seamless Updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hatkhoroc-debug-keystore-v1

      - name: Configure Android Permissions, FileProvider and Auto-Installer
        run: |
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="public_downloads" path="Download"/>
              <external-path name="external_storage_root" path="."/>
              <external-files-path name="my_download" path="Download"/>
              <external-files-path name="external_files" path="."/>
              <external-cache-path name="external_cache" path="."/>
              <cache-path name="internal_cache" path="."/>
              <files-path name="internal_files" path="."/>
          </paths>
          EOF

          python3 - << 'EOF'
          import os
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  content = f.read()

              permissions = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              """
              if "REQUEST_INSTALL_PACKAGES" not in content:
                  content = content.replace("<application", permissions + "\n    <application", 1)

              file_provider = """
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              """
              if "androidx.core.content.FileProvider" not in content:
                  content = content.replace("</application>", file_provider + "\n    </application>")

              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print("Successfully injected permissions and FileProvider into AndroidManifest.xml")
          EOF

          mkdir -p android/app/src/main/java/com/abujar/hatkhoroc/
          cat << 'EOF' > android/app/src/main/java/com/abujar/hatkhoroc/MainActivity.java
          package com.abujar.hatkhoroc;

          import android.app.DownloadManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.content.pm.Signature;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.webkit.DownloadListener;
          import android.webkit.WebView;
          import android.widget.Toast;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.BridgeActivity;
          import org.json.JSONObject;
          import java.io.File;
          import java.util.Arrays;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              private long downloadId = -1;
              private BroadcastReceiver downloadReceiver;
              private boolean pendingInstall = false;
              private boolean pendingForceUninstall = false;
              private volatile String downloadState = "idle";
              private volatile int downloadProgress = 0;
              private volatile String downloadError = "";
              private File downloadedApkFile = null;
              private final Handler progressHandler = new Handler(Looper.getMainLooper());
              private Runnable progressRunnable;

              public class WebAppInterface {
                  @android.webkit.JavascriptInterface
                  public void downloadAndInstallApk(final String apkUrl) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              startApkDownload(apkUrl, "HatKhorocApp");
                          }
                      });
                  }

                  @android.webkit.JavascriptInterface
                  public String getDownloadState() {
                      try {
                          JSONObject obj = new JSONObject();
                          obj.put("state", downloadState);
                          obj.put("progress", downloadProgress);
                          obj.put("error", downloadError);
                          return obj.toString();
                      } catch (Exception e) {
                          return "{\"state\":\"idle\",\"progress\":0,\"error\":\"\"}";
                      }
                  }

                  @android.webkit.JavascriptInterface
                  public void openInstaller() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              installOrForceUpdateApk(false);
                          }
                      });
                  }

                  @android.webkit.JavascriptInterface
                  public void forceUninstallAndInstall() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              installOrForceUpdateApk(true);
                          }
                      });
                  }

                  @android.webkit.JavascriptInterface
                  public void uninstallSelf() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              launchUninstallWithDownloadsBackdrop();
                          }
                      });
                  }

                  @android.webkit.JavascriptInterface
                  public void saveZipToDownloads(final String base64Data, final String fileName) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  byte[] decodedBytes = android.util.Base64.decode(base64Data.contains(",") ? base64Data.split(",")[1] : base64Data, android.util.Base64.DEFAULT);
                                  File downloadsDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                                  if (!downloadsDir.exists()) downloadsDir.mkdirs();
                                  File outputFile = new File(downloadsDir, fileName);
                                  java.io.FileOutputStream fos = new java.io.FileOutputStream(outputFile);
                                  fos.write(decodedBytes);
                                  fos.flush();
                                  fos.close();

                                  DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                                  if (dm != null) {
                                      dm.addCompletedDownload(
                                          fileName,
                                          "হাত খরচ রিপোর্ট প্যাকেজ",
                                          true,
                                          "application/zip",
                                          outputFile.getAbsolutePath(),
                                          outputFile.length(),
                                          true
                                      );
                                  }

                                  Toast.makeText(getApplicationContext(), "✅ ডাউনলোড ফোল্ডারে সেভ হয়েছে: " + fileName, Toast.LENGTH_LONG).show();
                              } catch (Exception e) {
                                  e.printStackTrace();
                                  Toast.makeText(getApplicationContext(), "সেভ করতে সমস্যা হয়েছে: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                              }
                          }
                      });
                  }
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setupDownloadReceiver();
                  setupDownloadListener();
              }

              private void setupDownloadListener() {
                  try {
                      WebView webView = this.bridge.getWebView();
                      if (webView != null) {
                          webView.addJavascriptInterface(new WebAppInterface(), "AndroidNativeUpdater");
                          webView.setDownloadListener(new DownloadListener() {
                              @Override
                              public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                                  startApkDownload(url, userAgent);
                              }
                          });
                      }
                  } catch (Exception e) {}
              }

              private void notifyWebDownloadState(final String state, final int progress, final String error) {
                  downloadState = state;
                  downloadProgress = progress;
                  downloadError = error != null ? error : "";
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if (bridge == null) return;
                              WebView webView = bridge.getWebView();
                              if (webView == null) return;
                              String safeErr = JSONObject.quote(downloadError);
                              String js = "if (window.__onNativeApkDownloadState) window.__onNativeApkDownloadState('"
                                  + state + "', " + progress + ", " + safeErr + ");";
                              webView.evaluateJavascript(js, null);
                          } catch (Exception ignored) {}
                      }
                  });
              }

              private void startApkDownload(String url, String userAgent) {
                  try {
                      if ("downloading".equals(downloadState) && downloadId != -1) {
                          notifyWebDownloadState("downloading", downloadProgress, "");
                          return;
                      }

                      DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                      if (dm == null) {
                          notifyWebDownloadState("failed", 0, "DownloadManager unavailable");
                          return;
                      }

                      String uniqueFileName = "hatkhoroc_" + System.currentTimeMillis() + ".apk";
                      DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                      request.setMimeType("application/vnd.android.package-archive");
                      if (userAgent != null && !userAgent.trim().isEmpty()) {
                          request.addRequestHeader("User-Agent", userAgent);
                      }
                      request.setDescription("হাত খরচ অ্যাপের নতুন আপডেট ডাউনলোড হচ্ছে...");
                      request.setTitle("hatkhoroc.apk");
                      request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      request.setAllowedOverMetered(true);
                      request.setAllowedOverRoaming(true);

                      try {
                          request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, uniqueFileName);
                          File pubDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                          downloadedApkFile = new File(pubDir, uniqueFileName);
                      } catch (Exception pubErr) {
                          File privDir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                          if (privDir != null) {
                              File oldApk = new File(privDir, "hatkhoroc_update.apk");
                              if (oldApk.exists()) oldApk.delete();
                          }
                          request.setDestinationInExternalFilesDir(this, Environment.DIRECTORY_DOWNLOADS, "hatkhoroc_update.apk");
                          downloadedApkFile = new File(privDir, "hatkhoroc_update.apk");
                      }

                      downloadId = dm.enqueue(request);
                      notifyWebDownloadState("downloading", 3, "");
                      startProgressPolling();
                      Toast.makeText(getApplicationContext(), "📥 ডাউনলোড ম্যানেজারে আপডেট ডাউনলোড শুরু হয়েছে...", Toast.LENGTH_SHORT).show();
                  } catch (Exception e) {
                      notifyWebDownloadState("failed", 0, e.getMessage() != null ? e.getMessage() : "Download failed");
                  }
              }

              private void startProgressPolling() {
                  stopProgressPolling();
                  progressRunnable = new Runnable() {
                      @Override
                      public void run() {
                          if (!"downloading".equals(downloadState) || downloadId == -1) return;
                          pollDownloadStatusOnce();
                          if ("downloading".equals(downloadState)) {
                              progressHandler.postDelayed(this, 350);
                          }
                      }
                  };
                  progressHandler.postDelayed(progressRunnable, 350);
              }

              private void stopProgressPolling() {
                  if (progressRunnable != null) {
                      progressHandler.removeCallbacks(progressRunnable);
                      progressRunnable = null;
                  }
              }

              private void pollDownloadStatusOnce() {
                  try {
                      if (downloadId == -1) return;
                      DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                      if (dm == null) return;
                      DownloadManager.Query query = new DownloadManager.Query();
                      query.setFilterById(downloadId);
                      Cursor cursor = dm.query(query);
                      if (cursor != null) {
                          if (cursor.moveToFirst()) {
                              int statusIdx = cursor.getColumnIndex(DownloadManager.COLUMN_STATUS);
                              int status = statusIdx != -1 ? cursor.getInt(statusIdx) : -1;

                              if (status == DownloadManager.STATUS_SUCCESSFUL) {
                                  int uriIdx = cursor.getColumnIndex(DownloadManager.COLUMN_LOCAL_URI);
                                  if (uriIdx != -1) {
                                      String localUriStr = cursor.getString(uriIdx);
                                      if (localUriStr != null && localUriStr.startsWith("file://")) {
                                          downloadedApkFile = new File(Uri.parse(localUriStr).getPath());
                                      }
                                  }
                                  stopProgressPolling();
                                  notifyWebDownloadState("completed", 100, "");
                              } else if (status == DownloadManager.STATUS_FAILED) {
                                  int reasonIdx = cursor.getColumnIndex(DownloadManager.COLUMN_REASON);
                                  int reason = reasonIdx != -1 ? cursor.getInt(reasonIdx) : -1;
                                  stopProgressPolling();
                                  notifyWebDownloadState("failed", 0, "Download failed (code " + reason + ")");
                              } else {
                                  int dlIdx = cursor.getColumnIndex(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR);
                                  int totIdx = cursor.getColumnIndex(DownloadManager.COLUMN_TOTAL_SIZE_BYTES);
                                  long dl = dlIdx != -1 ? cursor.getLong(dlIdx) : 0;
                                  long tot = totIdx != -1 ? cursor.getLong(totIdx) : 0;
                                  int pct = downloadProgress;
                                  if (tot > 0) {
                                      pct = (int) Math.min(99, Math.max(3, (dl * 100L) / tot));
                                  } else if (dl > 0) {
                                      pct = Math.min(88, Math.max(5, downloadProgress + 4));
                                  }
                                  notifyWebDownloadState("downloading", pct, "");
                              }
                          }
                          cursor.close();
                      }
                  } catch (Exception ignored) {}
              }

              private void setupDownloadReceiver() {
                  downloadReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          long id = intent.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1);
                          if (id == downloadId && downloadId != -1) {
                              pollDownloadStatusOnce();
                              if ("completed".equals(downloadState)) {
                                  Toast.makeText(context, "✅ ডাউনলোড সম্পন্ন! আপডেট বাটনে চাপ দিন।", Toast.LENGTH_SHORT).show();
                              }
                          }
                      }
                  };
                  try {
                      if (Build.VERSION.SDK_INT >= 33) {
                          registerReceiver(downloadReceiver, new IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE), Context.RECEIVER_EXPORTED);
                      } else {
                          registerReceiver(downloadReceiver, new IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE));
                      }
                  } catch (Exception e) {}
              }

              private boolean isApkSignatureCompatible(File apkFile) {
                  try {
                      if (apkFile == null || !apkFile.exists()) return true;
                      PackageManager pm = getPackageManager();
                      int flags = Build.VERSION.SDK_INT >= Build.VERSION_CODES.P
                          ? PackageManager.GET_SIGNING_CERTIFICATES
                          : PackageManager.GET_SIGNATURES;

                      PackageInfo installedInfo = pm.getPackageInfo(getPackageName(), flags);
                      PackageInfo archiveInfo = pm.getPackageArchiveInfo(apkFile.getAbsolutePath(), flags);
                      if (archiveInfo == null) return true;

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          if (installedInfo.signingInfo == null || archiveInfo.signingInfo == null) return true;
                          Signature[] s1 = installedInfo.signingInfo.getApkContentsSigners();
                          Signature[] s2 = archiveInfo.signingInfo.getApkContentsSigners();
                          if (s1 == null || s2 == null || s1.length == 0 || s2.length == 0) return true;
                          return Arrays.equals(s1[0].toByteArray(), s2[0].toByteArray());
                      } else {
                          Signature[] s1 = installedInfo.signatures;
                          Signature[] s2 = archiveInfo.signatures;
                          if (s1 == null || s2 == null || s1.length == 0 || s2.length == 0) return true;
                          return Arrays.equals(s1[0].toByteArray(), s2[0].toByteArray());
                      }
                  } catch (Exception e) {
                      return true;
                  }
              }

              private void launchUninstallWithDownloadsBackdrop() {
                  try {
                      Toast.makeText(getApplicationContext(), "🗑️ পুরনো ভার্সন আনইনস্টল করুন — এরপর ডাউনলোড থেকে নতুন ভার্সন ইনস্টল করুন", Toast.LENGTH_LONG).show();
                      try {
                          Intent downloadsIntent = new Intent(DownloadManager.ACTION_VIEW_DOWNLOADS);
                          downloadsIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(downloadsIntent);
                      } catch (Exception ignored) {}

                      Intent uninstallIntent = new Intent(Intent.ACTION_DELETE);
                      uninstallIntent.setData(Uri.parse("package:" + getPackageName()));
                      uninstallIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(uninstallIntent);
                  } catch (Exception e) {}
              }

              private void installOrForceUpdateApk(boolean forceUninstall) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          if (!getPackageManager().canRequestPackageInstalls()) {
                              pendingInstall = true;
                              pendingForceUninstall = forceUninstall;
                              Toast.makeText(this, "হাত খরচ অ্যাপ আপডেট করতে পারমিশন অন করুন", Toast.LENGTH_LONG).show();
                              Intent permIntent = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES);
                              permIntent.setData(Uri.parse("package:" + getPackageName()));
                              startActivity(permIntent);
                              return;
                          }
                      }

                      if (forceUninstall || !isApkSignatureCompatible(downloadedApkFile)) {
                          launchUninstallWithDownloadsBackdrop();
                          return;
                      }

                      Uri apkUri = null;
                      DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                      if (dm != null && downloadId != -1) {
                          apkUri = dm.getUriForDownloadedFile(downloadId);
                      }

                      if (apkUri == null && downloadedApkFile != null && downloadedApkFile.exists()) {
                          apkUri = FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", downloadedApkFile);
                      }

                      if (apkUri == null) {
                          Toast.makeText(this, "ডাউনলোড করা APK ফাইল খুঁজে পাওয়া যায়নি", Toast.LENGTH_SHORT).show();
                          return;
                      }

                      Intent installIntent = new Intent(Intent.ACTION_VIEW);
                      installIntent.setDataAndType(apkUri, "application/vnd.android.package-archive");
                      installIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      installIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      installIntent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP);

                      List<ResolveInfo> resInfoList = getPackageManager().queryIntentActivities(installIntent, PackageManager.MATCH_DEFAULT_ONLY);
                      for (ResolveInfo resolveInfo : resInfoList) {
                          grantUriPermission(resolveInfo.activityInfo.packageName, apkUri, Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      }
                      startActivity(installIntent);
                  } catch (Exception e) {
                      launchUninstallWithDownloadsBackdrop();
                  }
              }

              @Override
              public void onResume() {
                  super.onResume();
                  if ("downloading".equals(downloadState) && downloadId != -1) {
                      pollDownloadStatusOnce();
                  }
                  if (pendingInstall) {
                      boolean force = pendingForceUninstall;
                      pendingInstall = false;
                      pendingForceUninstall = false;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          if (getPackageManager().canRequestPackageInstalls()) {
                              installOrForceUpdateApk(force);
                          }
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  stopProgressPolling();
                  try {
                      if (downloadReceiver != null) unregisterReceiver(downloadReceiver);
                  } catch (Exception ignored) {}
              }
          }
          EOF

      - name: Generate Custom Android App Icons
        run: |
          mkdir -p assets
          cp public/logo.png assets/icon.png || true
          cp public/logo.png assets/splash.png || true
          npx @capacitor/assets generate --android || true

      - name: Auto Increment Android Version Code & Fix SigningConfig
        run: |
          BUILD_NUM=$((10000 + ${{ github.run_number }}))
          sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUM/g" android/app/build.gradle || true
          sed -i "s/versionName \".*\"/versionName \"1.$BUILD_NUM.0\"/g" android/app/build.gradle || true
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Prepare and Rename APK Files
        run: |
          mkdir -p apk_output
          find android/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} "apk_output/hatkhoroc.apk" \; || true
          cp apk_output/hatkhoroc.apk "apk_output/হাত খরচ.apk"
          ls -la apk_output/

      - name: Upload APK File (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: hatkhoroc-APK
          path: "apk_output/*"

      - name: Publish to GitHub Releases (Direct Download)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: latest
          name: "হাত খরচ - Latest Release"
          body: "স্বয়ংক্রিয়ভাবে জেনারেট হওয়া হাত খরচ অ্যান্ড্রয়েড অ্যাপ (hatkhoroc.apk)।"
          files: "apk_output/*"
          clobber: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
